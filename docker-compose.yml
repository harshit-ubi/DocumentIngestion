version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: document_ingestion_postgres
    restart: always
    environment:
      POSTGRES_DB: document_ingestion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_ingestion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
